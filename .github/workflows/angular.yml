name: Build Angular Library

on:
  push:
    branches: [ main, develop ]
    tags:
      - '*@*'               # Only tags containing '@' (our format)
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: ngx-library-workspace

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ngx-library-workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Detect library only if tag matches our format
      - name: Detect library from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: detect
        run: node scripts/detect-lib.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # Lint ALL libraries (on any push/tag/PR)
      - name: Lint all libraries
        run: |
          for lib in $(ls projects); do
            if [ -f "projects/$lib/package.json" ]; then
              echo "Linting $lib"
              ng lint $lib
            fi
          done

      # Run tests for ALL libraries (on any push/tag/PR)
      - name: Run unit tests for all libraries
        run: npm run test:ci   # assumes your test setup runs all projects

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: ngx-library-workspace/coverage/

      # Build only the detected library (on tag). No fallback – if build fails, job fails.
      - name: Build the detected library
        if: steps.detect.outputs.MATCHED_LIBRARY != ''
        run: ng build ${{ steps.detect.outputs.MATCHED_LIBRARY }}

      # Ensure the readme is packaged with the npm package
      - name: Verify README was copied
        run: |
          if [ -f "dist/${{ steps.detect.outputs.MATCHED_LIBRARY }}/README.md" ]; then
            echo "README.md found in package"
            cat "dist/${{ steps.detect.outputs.MATCHED_LIBRARY }}/README.md" | head -n 5
          else
            echo "README.md not found – npm page may show no description"
          fi

      # Package only on tag
      - name: Package library (on tag)
        if: steps.detect.outputs.MATCHED_LIBRARY != ''
        run: |
          cd dist/${{ steps.detect.outputs.MATCHED_LIBRARY }}
          npm pack
          mv *.tgz ../../../../${{ steps.detect.outputs.MATCHED_LIBRARY }}-${{ steps.detect.outputs.MATCHED_VERSION }}.tgz

      - name: Upload release artifact (on tag)
        if: steps.detect.outputs.MATCHED_LIBRARY != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.MATCHED_LIBRARY }}-${{ steps.detect.outputs.MATCHED_VERSION }}
          path: ngx-library-workspace/${{ steps.detect.outputs.MATCHED_LIBRARY }}-*.tgz