name: Build Angular Library

on:
  push:
    branches: [ main, develop ]
    tags:
      - '*@*'               # tags like library@1.0.0
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: ngx-libraries-workspace

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ngx-libraries-workspace/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint only real libraries (those with ng-package.json)
      - name: Lint all libraries
        run: |
          for lib in $(ls projects); do
            if [ -f "projects/$lib/ng-package.json" ]; then
              echo "Linting $lib"
              npx ng lint $lib || exit 1
            else
              echo "Skipping $lib (not a library)"
            fi
          done

      # Test only real libraries
      - name: Run unit tests for libraries
        run: |
          for lib in $(ls projects); do
            if [ -f "projects/$lib/ng-package.json" ]; then
              echo "Testing $lib"
              npx ng test $lib --watch=false || exit 1
            fi
          done
        env:
          PLAYWRIGHT_CHROMIUM_LAUNCH_OPTIONS: '{"headless":true}'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: ngx-libraries-workspace/coverage/

  # Separate job for building & packaging – only on tags
  build-and-package:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')   # 👈 only run on tag pushes
    strategy:
      matrix:
        node-version: [20.x]   # single version for build (faster)
    defaults:
      run:
        working-directory: ngx-libraries-workspace

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ngx-libraries-workspace/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Detect library from tag
        id: detect
        run: node detect-lib.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build detected library
        run: |
          export LIBRARY="${{ steps.detect.outputs.MATCHED_LIBRARY }}"
          npm run build:lib

      - name: Verify README
        run: |
          if [ -f "dist/${{ steps.detect.outputs.MATCHED_LIBRARY }}/README.md" ]; then
            echo "README.md found"
          else
            echo "README.md missing – npm page will show no description"
            exit 1
          fi

      - name: Package library
        run: |
          cd dist/${{ steps.detect.outputs.MATCHED_LIBRARY }}
          npm pack
          mv *.tgz ../../../${{ steps.detect.outputs.MATCHED_LIBRARY }}-${{ steps.detect.outputs.MATCHED_VERSION }}.tgz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.detect.outputs.MATCHED_LIBRARY }}-${{ steps.detect.outputs.MATCHED_VERSION }}
          path: ngx-libraries-workspace/${{ steps.detect.outputs.MATCHED_LIBRARY }}-*.tgz

      - name: Publish to npm
        run: |
          cd dist/${{ steps.detect.outputs.MATCHED_LIBRARY }}
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}