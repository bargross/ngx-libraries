name: Build Angular Library

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: ngx-library-workspace   # 👈 all commands run inside workspace

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ngx-library-workspace/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint the library
        run: ng lint ngx-update-notifier

      - name: 🧪 Run unit tests (Vitest)
        run: npm run test:ci

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: ngx-library-workspace/coverage/

      - name: 🏗️ Build the library
        run: ng build ngx-update-notifier

      # Package only on tag push
      - name: 📦 Package library (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist/ngx-update-notifier
          npm pack
          mv *.tgz ../../../../ngx-update-notifier-${{ github.ref_name }}.tgz

      - name: 💾 Upload release artifact (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ngx-update-notifier-${{ github.ref_name }}
          path: ngx-library-workspace/ngx-update-notifier-*.tgz